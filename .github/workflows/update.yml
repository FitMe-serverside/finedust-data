name: Update air quality

on:
  schedule:
    # 10분마다 확인(전국 1번 호출). GitHub 예약 실행은 늦거나 빠질 때가 있어 자주 돌려 둔다.
    # 새 값이 있을 때만 커밋한다.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-air
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch AirKorea
        env:
          AIRKOREA_KEY: ${{ secrets.AIRKOREA_KEY }}
        run: python scripts/fetch.py
      - name: Commit if changed
        run: |
          git config user.name "finedust-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "air $(date -u +%FT%H:%MZ)" && git push; fi
